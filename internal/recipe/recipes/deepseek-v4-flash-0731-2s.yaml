  digest: sha256:e4f88a835143cd22aee2397a26ec6bb80b3a4a6fe0c882bcbc63822904766089
  image_bytes: 10238912364
  image_disk_bytes: 30716737092
  environment:
    CUTE_DSL_ARCH: sm_121a
    MAX_JOBS: "4"
  shm_bytes: 34359738368
  memory_lock: true
  ipc_lock: true
