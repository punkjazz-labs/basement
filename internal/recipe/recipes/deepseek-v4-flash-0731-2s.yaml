schema_version: 1
id: deepseek-v4-flash-0731-2s
# The first two-Spark recipe: DeepSeek's official V4 Flash 0731 release
# (166.9 GB, natively FP8 attention + FP4 experts, does not fit one 128 GB
# Spark), served with vLLM TP=2 across two GB10 machines cabled back to
# back with ConnectX-7. The NVIDIA NVFP4 repo was rejected on provenance:
# it quantizes the April preview (last modified 2026-06-15), not 0731.
#
# Launch topology follows the community recipe that runs this exact
# workload (tonyd2wild/Deepseek-v4-Flash-TP2-DGX-Spark-500k-CTX): plain
# vllm serve with --nnodes 2, worker rank first, weights pre-downloaded on
# both nodes, NCCL pinned to the RoCE fabric. The interconnect environment
# below carries that recipe's interface names (rocep1s0f0 / enp1s0f0np0);
# if a unit reports different names, this recipe needs a revision, not an
# override.
#
# Qualification flags, in honesty order:
# - runtime image is the same pinned vllm/vllm-openai the pack already
#   uses; DeepSeek V4 MoE support in this pinned digest is unverified
#   until the two-node install runs.
# - reasoning_parser/tool_call_parser: DeepSeek V4 Flash emits the same
#   literal think-tag convention the qwen3 parser splits on, so qwen3 is
#   the closest allowlisted functional match; both are unverified against
#   real output and qualification decides whether they hold.
# - max_model_len starts at 131072, far below the 500k the community
#   recipe reaches, so first qualification measures a conservative
#   configuration before context is raised.
# - memory_model omitted: TP=2 shards weights across nodes and the flat
#   single-node formula would be wrong by construction.
version: 1
display_name: DeepSeek V4 Flash 0731
publisher: DeepSeek
model_by: DeepSeek
recipe_by: tonyd2wild (community launch topology)
model_released: July 2026
trust: basement-candidate
verification: candidate
source:
  url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
  revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
topology:
  spark_count: 2
  interconnect:
    kind: connectx7
    master_port: 29501
    shared_environment:
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: rocep1s0f0
      NCCL_IB_GID_INDEX: "3"
      NCCL_SOCKET_IFNAME: enp1s0f0np0
      GLOO_SOCKET_IFNAME: enp1s0f0np0
      TP_SOCKET_IFNAME: enp1s0f0np0
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
    head_environment: {}
    worker_environment: {}
runtime:
