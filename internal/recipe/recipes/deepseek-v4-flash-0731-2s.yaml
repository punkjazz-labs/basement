schema_version: 1
id: deepseek-v4-flash-0731-2s
# The first two-Spark recipe: DeepSeek's official V4 Flash 0731 release
# (166.9 GB, natively FP8 attention + FP4 experts, does not fit one 128 GB
# Spark), served with vLLM TP=2 across two GB10 machines cabled back to
# back with ConnectX-7. The NVIDIA NVFP4 repo was rejected on provenance:
# it quantizes the April preview (last modified 2026-06-15), not 0731.
#
# Launch topology follows the community recipe that runs this exact
# workload (tonyd2wild/Deepseek-v4-Flash-TP2-DGX-Spark-500k-CTX): plain
# vllm serve with --nnodes 2, worker rank first, weights pre-downloaded on
# both nodes, NCCL pinned to the RoCE fabric. Each node detects its own
# cabled ConnectX port at deploy time and pins NCCL to that; the interface
# names below are the community recipe's, kept as the fallback for when the
# kernel's answer is missing or ambiguous (no link yet, or both ports
# cabled).
#
# Qualification flags, in honesty order:
# - runtime image is vLLM v0.26.0, not the v0.25.1 the rest of the pack
#   pins. This model's sparse-MLA decode passes swa_topk_lens to
#   flashinfer, and only flashinfer 0.6.14 accepts that argument; v0.25.1
#   bundles the release three days older and dies on real GB10 hardware
#   (vllm-project/vllm issue 48054, fixed by PR 47669). v0.26.0 is the
#   earliest release that carries the fix, so this recipe must not be
#   moved back below it. DeepSeek V4 MoE support in this digest is still
#   unverified until the two-node install runs.
# - reasoning_parser/tool_call_parser: DeepSeek V4 Flash emits the same
#   literal think-tag convention the qwen3 parser splits on, so qwen3 is
#   the closest allowlisted functional match; both are unverified against
#   real output and qualification decides whether they hold.
# - max_model_len starts at 131072, far below the 500k the community
#   recipe reaches, so first qualification measures a conservative
#   configuration before context is raised.
# - memory_model omitted: TP=2 shards weights across nodes and the flat
#   single-node formula would be wrong by construction.
version: 1
display_name: DeepSeek V4 Flash 0731
publisher: DeepSeek
model_by: DeepSeek
recipe_by: tonyd2wild (community launch topology)
model_released: July 2026
trust: basement-candidate
verification: candidate
source:
  url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
  revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
topology:
  spark_count: 2
  interconnect:
    kind: connectx7
    master_port: 29501
    shared_environment:
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: rocep1s0f0
      NCCL_IB_GID_INDEX: "3"
      NCCL_SOCKET_IFNAME: enp1s0f0np0
      GLOO_SOCKET_IFNAME: enp1s0f0np0
      TP_SOCKET_IFNAME: enp1s0f0np0
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
    head_environment: {}
    worker_environment: {}
runtime:
  kind: vllm
  image: vllm/vllm-openai
  digest: sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
  image_bytes: 10349296324
  image_disk_bytes: 31047888972
  environment:
    CUTE_DSL_ARCH: sm_121a
    MAX_JOBS: "4"
    # tilelang also exports each compiled kernel into a tempfile directory and
    # loads the shared object from there, so the process temp dir must allow
    # exec too; /tmp stays noexec, TMPDIR moves to its own writable mount.
    TMPDIR: /root/tmp
  # vLLM builds this model's "mhc" kernels with tilelang, which writes its JIT
  # kernel cache to /root/.tilelang while the module is being imported. On the
  # read-only root filesystem every container gets, that import raises OSError
  # and the worker dies reporting tilelang as missing, after the 74 GiB of
  # weights have loaded. The cache cannot live on the scratch tmpfs either:
  # tilelang loads the shared objects it compiles, and /tmp is noexec.
  writable_paths:
    - /root/.tilelang
    - /root/tmp
  shm_bytes: 34359738368
  memory_lock: true
  ipc_lock: true
artifacts:
  - role: primary
    repository: deepseek-ai/DeepSeek-V4-Flash-0731
    revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
    expected_bytes: 166898661074
    licence: MIT
    licence_url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731/blob/e3cd60e7de98e9867116860d522499a728de1cf9/LICENSE
requirements:
  architecture: aarch64
  dgx_spark: true
  docker: true
  nvidia_container_runtime: true
  per_node_minimum_memory_bytes: 120000000000
  per_node_memory_reserve_bytes: 12000000000
  safety_margin_bytes: 20000000000
  secrets: []
  required_licence_acceptance: true
service:
  internal_port: 8000
  default_host_port: 8000
  served_model_id: deepseek-ai/DeepSeek-V4-Flash-0731
  vllm:
    tensor_parallel_size: 2
    kv_cache_dtype: fp8
    attention_backend: ""
    moe_backend: auto
    linear_backend: ""
    # 0.80, not the pack's usual 0.85: on unified memory the manager, Docker
    # and the OS live inside the same pool vLLM budgets from, and at 0.85 the
    # first long generation pushed the driver out of memory on real hardware
    # (NVRM NV_ERR_NO_MEMORY mid-decode with this model serving alone).
    gpu_memory_utilization: "0.80"
    max_model_len: 131072
    max_num_seqs: 8
    max_num_batched_tokens: 0
    multimodal_image_limit: 0
    speculative_method: ""
    speculative_tokens: 0
    speculative_moe_backend: ""
    speculative_model_role: ""
    reasoning_parser: qwen3
    tool_call_parser: qwen3_xml
    load_format: ""
    chat_template_file: ""
    chat_template:
      enable_thinking: true
      preserve_thinking: true
    generation:
      temperature: 0.6
      top_p: 0.95
      top_k: 0
      min_p: 0
      presence_penalty: 0
      repetition_penalty: 1
    # vLLM's fuse_norm_quant and fuse_act_quant compilation passes are on by
    # default and garble this model's output on SM121 even at temperature 0
    # (vllm-project/vllm issue 50773, still open). This sends the documented
    # workaround and nothing else. It costs whatever those fusions were
    # worth, so it stays on until qualification on our own hardware shows the
    # passes are safe here; nothing but that measurement takes it back off.
    disable_quant_fusions: true
    trust_remote_code: true
    chunked_prefill: true
    async_scheduling: false
    prefix_caching: false
    auto_tool_choice: true
operations:
  - type: verify_architecture
  - type: verify_dgx_spark
  - type: verify_memory_capacity
  - type: verify_disk
  - type: verify_port
  - type: verify_docker
  - type: verify_nvidia_runtime
  - type: verify_artifact_access
  - type: pull_image
  - type: download_artifact
  - type: write_generated_config
  - type: create_container
  - type: verify_memory
  - type: start_container
  - type: wait_http
  - type: verify_openai_inference
uninstall:
  - type: stop_container
  - type: remove_container
  - type: remove_artifact_if_unshared
