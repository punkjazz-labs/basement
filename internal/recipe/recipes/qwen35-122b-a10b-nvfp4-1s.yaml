schema_version: 1
id: qwen35-122b-a10b-nvfp4-1s
# Serve flags mirror RedHatAI's own model card (fetched live 2026-08-03):
#   vllm serve RedHatAI/Qwen3.5-122B-A10B-NVFP4 --reasoning-parser qwen3 \
#     --speculative-config '{"method":"qwen3_next_mtp","num_speculative_tokens":2}' \
#     --moe_backend flashinfer_cutlass
# moe_backend: the card pins flashinfer_cutlass explicitly, but this recipe
# schema's moe backend allowlist does not include that value yet. Using
# "auto" lets vLLM select its own backend instead of a fabricated policy
# value; revisit once the allowlist is extended.
# speculative_method: the card's actual method is qwen3_next_mtp, confirmed
# by mtp_num_hidden_layers: 1 in config.json. This schema's generic label
# for that family is "mtp" (the same value the sibling Qwen 3.6 recipe
# uses); speculative_model_role stays empty because MTP is a built-in head,
# not a separate drafter artifact.
# runtime image: reused from the Laguna recipe (vanilla vllm/vllm-openai)
# rather than the MiaAI Qwen 3.6 b12x linear-backend image, since this model
# needs no custom linear backend. Qwen3.5 MoE + MTP support in this pinned
# image is unverified until qualification.
# memory_model omitted: Qwen3.5-122B-A10B is a hybrid linear/full-attention
# model (full_attention_interval: 4 in config.json - only 12 of 48 layers do
# standard growing KV attention, the rest are constant-size linear-attention
# state). The schema's flat kv_bytes_per_token formula assumes uniform
# attention, so a defensible number needs qualification-time measurement,
# not a guess from the flat formula.
