schema_version: 1
id: nemotron-omni-30b-a3b-nvfp4-1s
# Serve flags mirror NVIDIA's own DGX Spark section (fetched live
# 2026-08-03): vllm/vllm-openai:v0.20.0, --gpu-memory-utilization 0.8,
# --max-model-len 131072, --tensor-parallel-size 1, --trust-remote-code,
# --max-num-seqs 8, --max-num-batched-tokens 32768, --enable-prefix-caching,
# --enable-auto-tool-choice --tool-call-parser qwen3_coder, --shm-size=16g.
# The card requires vLLM >= 0.20.0 exactly; the pinned image below is the
# same generic vllm/vllm-openai pin the Laguna recipe uses and has not been
# confirmed to satisfy that floor. Verify the actual served vLLM version at
# qualification before shipping this as basement-verified.
# Text-only serving first: the card's omni (image/audio/video) inputs use
# custom code (CRADIO v4-H + Parakeet encoders) that is not confirmed as a
# stock vLLM multimodal path, so --limit-mm-per-prompt and the video/audio
# flags are left out and multimodal_image_limit is 0.
#
# One deviation from the card, flagged for follow-up:
# - speculative_method is empty: the card documents no speculative decoding
#   for this model (README has zero mentions of speculative/draft/MTP), so
#   the recipe declares none rather than a value the model cannot honour.
# - reasoning_parser: the card's own parser is nemotron_v3, which is not in
#   this schema's allowlist (qwen3/poolside_v1 only), and there is no empty
#   option either. The card's "Budget-Controlled Reasoning" example (and its
#   raw content shows literal <think>...</think> tags, the same delimiter
#   convention vLLM's built-in qwen3 parser splits on, so "qwen3" is used as
#   the closer functional match rather than an arbitrary guess. This is
#   still unverified against the model's actual output and should be
#   confirmed at qualification.
