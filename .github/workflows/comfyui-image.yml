name: comfyui-image

# Builds and publishes the pinned ComfyUI container image that media
# generation recipes reference by digest. Publishing from CI rather than from
# someone's machine is deliberate: the image bytes are then traceable to a
# public build of the committed Dockerfile, which is exactly the provenance
# that third-party images cannot offer.
#
# Tagged separately from manager releases (comfyui-image-v*) because the
# image version tracks ComfyUI's, not basement's, and rebuilding it must not
# imply a manager release. The release workflow's 'v*' trigger does not match
# these tags.

on:
  push:
    tags: ['comfyui-image-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # An arm64 runner because the GB10 is arm64 and the Dockerfile pins an
    # arm64 CUDA base; building natively avoids emulation entirely.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      # On a tag push the image version comes from the tag; a manual
      # workflow_dispatch run publishes the version named in the Dockerfile's
      # ComfyUI pin and is meant for the first publish or a re-run.
      - name: Build image
        run: |
          version="${GITHUB_REF_NAME#comfyui-image-}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version=v0.30.0
          image="ghcr.io/${{ github.repository_owner }}/basement-comfyui:${version}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build --build-arg MAX_JOBS=4 --tag "${image}" packaging/comfyui-image

      - name: Push image and report digest
        run: |
          docker push "${IMAGE}"
          # The digest printed here is what a recipe pins. It is created by
          # the registry at push time, so it cannot be known before this step.
          docker image inspect "${IMAGE}" --format '{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}'
          docker image inspect "${IMAGE}" --format 'Size: {{.Size}} bytes'
